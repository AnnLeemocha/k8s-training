# =============================================================================
# dr-demo / 05-cephfs-pod2.yaml
# 讀取端：另一個 Pod 同時掛同一個 CephFS，證明 RWX 真的是「共享」。
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: cephfs-test-2
  namespace: dr-demo
spec:
  containers:
    - name: test
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          cat /shared/dr-test.txt
          sleep 36000
      volumeMounts:
        - name: shared
          mountPath: /shared            # 跟 cephfs-test-1 同一個 PVC、同一份檔案
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: shared-data
