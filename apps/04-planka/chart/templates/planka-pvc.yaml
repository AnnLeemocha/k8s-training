apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: planka-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "planka.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.planka.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.planka.persistence.size }}
