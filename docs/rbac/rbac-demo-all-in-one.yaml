# rbac-demo — 完整合併版 manifest（單檔一次套用）
#
# 教學拆解版在 manifest/ 目錄（00~05 依序 apply，適合逐步講解）；
# 這份是給「已經教完拆解版、要快速重建環境」或「demo 用」的合併版，
# 內容與 manifest/ 目錄逐檔內容完全一致。
#
# 這不是課程原本 7 個產品之一，是 docs/rbac/README.md 的配套教學資源，
# 沒有對外服務（無 Service/HTTPRoute），純粹示範 RBAC。
#
# 用法：
#   kubectl apply -f rbac-demo-all-in-one.yaml

# Step 1：建立 RBAC 教學專用的 Namespace
# 教學重點：這不是「第 8 個產品」，這裡沒有對外服務（沒有 Service/
# HTTPRoute），純粹用來放 RBAC 練習用的 ServiceAccount/Role/ClusterRole，
# 跟其他 7 個產品各自的 namespace 完全隔開，不影響任何已上線的應用。
apiVersion: v1
kind: Namespace
metadata:
  name: rbac-demo
  labels:
    # 純標記用途，方便 `kubectl get ns -l xxx` 篩選，對 K8s 本身沒有
    # 特殊行為意義。
    app.kubernetes.io/part-of: k8s-training
    training/product: rbac-demo
---
# Step 2：限制此 Namespace 可用的資源總量與單一容器預設值
# 教學重點：跟其他產品一樣的慣例（見 docs/resources/README.md），即使這個
# namespace 只跑幾個極輕量的 debug Pod，也維持「每個 namespace 都該有
# ResourceQuota/LimitRange」的企業慣例，數字刻意抓得很小，反映這裡的真實
# 用途（sleep 待命的小 Pod，不是應用程式）。
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rbac-demo-quota
  namespace: rbac-demo
spec:
  hard:
    requests.cpu: 200m
    requests.memory: 256Mi
    limits.cpu: 500m
    limits.memory: 512Mi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: rbac-demo-limitrange
  namespace: rbac-demo
spec:
  limits:
    - type: Container
      default:
        cpu: 50m
        memory: 64Mi
      defaultRequest:
        cpu: 20m
        memory: 32Mi
      max:
        cpu: 200m
        memory: 256Mi
      min:
        cpu: 10m
        memory: 16Mi
---
# Step 3（對照組 1：預設拒絕）：只建立 ServiceAccount，不綁任何 Role
# 教學重點：這是整份 RBAC 教材最重要的對照組——跟 NetworkPolicy「預設全
# 通，要自己 default-deny」相反，K8s RBAC 的預設就是「零權限」：一個
# ServiceAccount 只要沒有任何 RoleBinding/ClusterRoleBinding 指到它，
# 它連查自己 namespace 裡的 Pod 清單都做不到，errors 會是 Forbidden，
# 不是查不到資料。這支 Pod 稍後會拿來實際證明這件事。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: no-permissions
  namespace: rbac-demo
---
# Step 4（對照組 2：namespace 範圍的最小權限）：Role + RoleBinding
# 教學重點：Role 是「namespace 範圍」的權限規則，只對 metadata.namespace
# 指定的那個 namespace 生效——就算 rbac-demo 裡的 Pod 想查 drawio
# namespace 的 Pod，一樣會被拒絕，因為 Role 從定義上就跨不出自己的
# namespace（這點會在下面的 ClusterRole 對照組看到差異）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ns-pod-viewer
  namespace: rbac-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-viewer
  namespace: rbac-demo
rules:
  # apiGroups: "" 代表 core API group（Pod/ConfigMap/Service 這些內建資源
  # 都屬於這一組，寫法上用空字串，不是省略不寫）。
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps"]
    # 只給讀取權限：get（查單一物件）、list（查清單）、watch（訂閱變化），
    # 完全沒有 create/update/patch/delete，示範「最小權限」原則——這個
    # SA 連自己 namespace 裡的 Pod 都不能刪除或修改。
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ns-pod-viewer-binding
  namespace: rbac-demo
subjects:
  # RoleBinding 把「誰」（這裡是 ServiceAccount）跟「有什麼權限」
  # （roleRef 指到的 Role）綁在一起，兩者缺一不可：光有 Role
  # 沒有 RoleBinding，等於權限規則寫好了但沒人拿得到。
  - kind: ServiceAccount
    name: ns-pod-viewer
    namespace: rbac-demo
roleRef:
  kind: Role
  name: pod-viewer
  apiGroup: rbac.authorization.k8s.io
---
# Step 5（對照組 3：叢集範圍的權限）：ClusterRole + ClusterRoleBinding
# 教學重點：Node/Namespace 這類資源本身就是「叢集範圍」（cluster-scoped，
# 不屬於任何 namespace），Role 的 namespace 邊界天生就管不到它們——
# 就算把 Step 4 的 Role 加上 nodes 權限也一樣無效，一定要用沒有
# namespace 邊界的 ClusterRole。這裡刻意示範「叢集範圍的資源」用
# ClusterRole 才能讀到，藉此跟 Step 4 的 Role 做對照。
# ClusterRoleBinding 綁定的 ServiceAccount 本身仍然是某個 namespace
# 底下的物件（這裡是 rbac-demo），只是它被授予的權限範圍是整個叢集。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-node-viewer
  namespace: rbac-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-viewer
  # ClusterRole 沒有 namespace 欄位——它本身就是叢集範圍的物件。
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-node-viewer-binding
subjects:
  - kind: ServiceAccount
    name: cluster-node-viewer
    namespace: rbac-demo
roleRef:
  # roleRef.kind 是 ClusterRole，才會是「叢集範圍」的綁定；
  # 如果這裡改成 Role，效果就會退化成只在 rbac-demo namespace 內生效
  # （RoleBinding 也可以 roleRef 一個 ClusterRole，那樣是另一種常見
  # 組合：套用叢集預先定義好的權限樣板，但只在某個 namespace 內生效——
  # 這裡刻意示範最單純的 ClusterRole + ClusterRoleBinding 全叢集組合）。
  kind: ClusterRole
  name: node-viewer
  apiGroup: rbac.authorization.k8s.io
---
# Step 6：三個「debug Pod」，各自掛一個 Step 3~5 建立的 ServiceAccount
# 教學重點：光有 ServiceAccount/Role/RoleBinding 還是「紙上談兵」，K8s
# 會自動把 ServiceAccount 的 token 掛進每個 Pod（預設路徑
# /var/run/secrets/kubernetes.io/serviceaccount/token），Pod 裡的
# kubectl 會自動讀這個 token 當作身分驗證，完全不用額外設定
# kubeconfig——這三支 Pod 就是讓學員實際 exec 進去下指令，親眼看到
# RBAC 允許/拒絕的真實 API 回應，而不是只憑 `kubectl auth can-i` 模擬。
apiVersion: v1
kind: Pod
metadata:
  name: debug-no-permissions
  namespace: rbac-demo
  labels:
    app: rbac-debug
    training/rbac-case: no-permissions
spec:
  # 明確指定要用哪個 ServiceAccount；沒寫的話會用該 namespace 的
  # default ServiceAccount（同樣沒有任何 RoleBinding，行為會一樣）。
  serviceAccountName: no-permissions
  # 這幾支 Pod 只用來下 kubectl 指令，不需要靠 Service 被其他 Pod
  # 發現，關掉 Docker-links 風格的自動注入環境變數，避免不必要的雜訊
  # （沿用本教材其他產品已踩過的 FLARUM_PORT 那類命名碰撞教訓）。
  enableServiceLinks: false
  containers:
    - name: kubectl
      image: alpine/k8s:1.31.0
      # alpine/k8s 這個映像內建 kubectl/helm/kustomize 等工具，這裡把
      # entrypoint 蓋掉改成純待命，讓學員自己 exec 進來手動下指令，
      # 教學上更直觀。
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
      securityContext:
        # 這支容器只是待命讓人 exec 進去下 kubectl 指令，不需要 bind
        # 低號 port、chown 檔案或 setuid/setgid 這類需要特殊 capability
        # 的行為，直接可以全部 drop，不會像 mysql/postgres 那類
        # 「entrypoint 先用 root 再 setuid」的映像一樣被擋下來。
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
---
apiVersion: v1
kind: Pod
metadata:
  name: debug-ns-pod-viewer
  namespace: rbac-demo
  labels:
    app: rbac-debug
    training/rbac-case: ns-pod-viewer
spec:
  serviceAccountName: ns-pod-viewer
  enableServiceLinks: false
  containers:
    - name: kubectl
      image: alpine/k8s:1.31.0
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
---
apiVersion: v1
kind: Pod
metadata:
  name: debug-cluster-node-viewer
  namespace: rbac-demo
  labels:
    app: rbac-debug
    training/rbac-case: cluster-node-viewer
spec:
  serviceAccountName: cluster-node-viewer
  enableServiceLinks: false
  containers:
    - name: kubectl
      image: alpine/k8s:1.31.0
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
