apiVersion: v1
kind: Secret
metadata:
  name: peertube-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "peertube.labels" . | nindent 4 }}
type: Opaque
stringData:
  PEERTUBE_SECRET: {{ .Values.peertube.secret | quote }}
  PEERTUBE_DB_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  PEERTUBE_ADMIN_EMAIL: {{ .Values.peertube.adminEmail | quote }}
  PT_INITIAL_ROOT_PASSWORD: {{ .Values.peertube.rootPassword | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: peertube-storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "peertube.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.peertube.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.peertube.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peertube
  namespace: {{ .Release.Namespace }}
  labels:
    app: peertube
    {{- include "peertube.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: peertube
  template:
    metadata:
      labels:
        app: peertube
    spec:
      {{- with .Values.nodePlacement.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodePlacement.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      containers:
        - name: peertube
          image: "{{ .Values.peertube.image.repository }}:{{ .Values.peertube.image.tag }}"
          env:
            - name: PEERTUBE_WEBSERVER_HOSTNAME
              value: {{ .Values.peertube.webserverHostname | quote }}
            - name: PEERTUBE_WEBSERVER_PORT
              value: "443"
            - name: PEERTUBE_WEBSERVER_HTTPS
              value: "true"
            - name: PEERTUBE_TRUST_PROXY
              value: '["loopback","linklocal","uniquelocal"]'
            - name: PEERTUBE_SECRET
              valueFrom:
                secretKeyRef:
                  name: peertube-secret
                  key: PEERTUBE_SECRET
            - name: PEERTUBE_DB_HOSTNAME
              value: "postgres"
            - name: PEERTUBE_DB_PORT
              value: "5432"
            - name: PEERTUBE_DB_NAME
              value: {{ .Values.postgres.auth.database | quote }}
            - name: PEERTUBE_DB_USERNAME
              value: {{ .Values.postgres.auth.user | quote }}
            - name: PEERTUBE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: peertube-secret
                  key: PEERTUBE_DB_PASSWORD
            - name: PEERTUBE_REDIS_HOSTNAME
              value: "redis"
            - name: PEERTUBE_REDIS_PORT
              value: "6379"
            - name: PEERTUBE_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: peertube-secret
                  key: PEERTUBE_ADMIN_EMAIL
            - name: PEERTUBE_SIGNUP_ENABLED
              value: "false"
            - name: PT_INITIAL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: peertube-secret
                  key: PT_INITIAL_ROOT_PASSWORD
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          resources:
            {{- toYaml .Values.peertube.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/config
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /api/v1/config
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: storage
              mountPath: /app/storage
      securityContext:
        fsGroup: 999
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: peertube-storage
---
apiVersion: v1
kind: Service
metadata:
  name: peertube
  namespace: {{ .Release.Namespace }}
  labels:
    app: peertube
    {{- include "peertube.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: peertube
  ports:
    - name: http
      port: 80
      targetPort: http
