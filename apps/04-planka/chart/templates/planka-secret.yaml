apiVersion: v1
kind: Secret
metadata:
  name: planka-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "planka.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.postgres.auth.user }}:{{ .Values.postgres.auth.password }}@postgres:5432/{{ .Values.postgres.auth.database }}"
  SECRET_KEY: {{ .Values.planka.secretKey | quote }}
  DEFAULT_ADMIN_PASSWORD: {{ .Values.planka.admin.password | quote }}
