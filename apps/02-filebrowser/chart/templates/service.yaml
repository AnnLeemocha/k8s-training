apiVersion: v1
kind: Service
metadata:
  name: {{ include "filebrowser.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "filebrowser.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: filebrowser
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
