# =============================================================================
# dr-demo / 02-postgres.yaml
# PostgreSQL 本體：Secret（帳密）+ Deployment + Service。
# 還原驗證時的判斷標準：不是「Pod Running」，而是 `SELECT * FROM disaster_test;`
# 查得到災難前寫入的 DR-TEST-DB-001 那一筆資料（見 script/check-data.sh）。
# =============================================================================
apiVersion: v1
kind: Secret                            # 敏感資料；Velero 預設會備份 Secret（備份檔內是 base64，不是加密！）
metadata:
  name: postgres-secret
  namespace: dr-demo
type: Opaque                            # 一般 key/value 型 Secret
stringData:                             # 明文撰寫，API Server 寫入時自動轉 base64 存到 data
  POSTGRES_USER: drtest                 # 官方 image 首次 initdb 時建立的使用者
  POSTGRES_PASSWORD: drtest-password    # 教學用固定密碼；注意：只在「空資料目錄」第一次初始化時生效
  POSTGRES_DB: drdemo                   # 首次初始化時建立的資料庫
---
apiVersion: apps/v1
kind: Deployment                        # 單副本 DB 用 Deployment 示範；正式環境建議 StatefulSet
metadata:
  name: postgres
  namespace: dr-demo
spec:
  replicas: 1                           # RWO 磁碟只能被一個 Pod 掛載
  selector:
    matchLabels:
      app: postgres                     # Deployment 用這個 label 找到自己管理的 Pod
  template:
    metadata:
      labels:
        app: postgres                   # 必須與 selector 一致；Service 也靠它導流
    spec:
      containers:
        - name: postgres
          image: postgres:16            # 官方 PostgreSQL 16
          ports:
            - containerPort: 5432       # PostgreSQL 預設 port（宣告用途，實際不影響連線）
          env:
            - name: POSTGRES_USER       # 從 Secret 讀使用者名稱
              valueFrom:
                secretKeyRef:
                  name: postgres-secret # Secret 不存在 → Pod 卡在 CreateContainerConfigError
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD   # 從 Secret 讀密碼
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB         # 從 Secret 讀資料庫名稱
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            # PostgreSQL 資料放在 PVC 底下的子目錄，
            # 避免 /var/lib/postgresql/data 的 lost+found 造成 initdb 失敗
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-data                # 對應下方 volumes 的名稱
              mountPath: /var/lib/postgresql/data  # 資料庫檔案實際寫在這裡 → 也就是 PVC 裡
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data    # 對應 01-postgres-pvc.yaml
---
apiVersion: v1
kind: Service                           # 穩定的連線入口：postgres.dr-demo.svc.cluster.local
metadata:
  name: postgres
  namespace: dr-demo
spec:
  selector:
    app: postgres                       # 導流到 label app=postgres 的 Pod
  ports:
    - port: 5432                        # Service port
      targetPort: 5432                  # 容器 port
  # 注意：還原後 ClusterIP 會重新分配（實測 172.31.212.253 → 172.31.248.152），
  # 應用程式一律用 DNS 名稱連線，不要寫死 IP。
