# =============================================================================
# 05-backup-pitfalls / 02-postgres-config.yaml
# 應用程式「設定」與「密碼」——兩者都不在 PVC 裡，而是 K8s Resource。
# 情境 2/3 會故意把它們排除在備份之外，觀察還原後 Pod 會卡在哪裡。
# =============================================================================
apiVersion: v1
kind: Secret                   # 存放敏感資料（DB 帳密）；Velero 預設會備份 Secret
metadata:
  name: postgres-secret
  namespace: dr-pitfall
type: Opaque                   # 一般用途的 key/value Secret
stringData:                    # 用明文撰寫，API Server 寫入時自動轉成 base64 的 data
  POSTGRES_USER: shop          # 初始化時建立的 DB 使用者
  POSTGRES_PASSWORD: shop-password   # 教學用固定密碼；正式環境請用外部 Secret 管理
  POSTGRES_DB: shop            # 初始化時建立的資料庫名稱
---
apiVersion: v1
kind: ConfigMap                # 非敏感設定；這裡放「第一次初始化 DB 時要執行的 SQL」
metadata:
  name: postgres-init-sql
  namespace: dr-pitfall
data:
  # 官方 postgres image 只在「資料目錄是空的」(第一次 initdb) 時才執行
  # /docker-entrypoint-initdb.d/ 底下的 .sql —— 這是情境 1 的關鍵：
  # 如果還原時資料沒回來，PVC 是空的，這支 SQL 會「再跑一次」，
  # 於是 table 存在、種子資料也存在，看起來一切正常，但業務資料全部不見。
  01-schema.sql: |
    CREATE TABLE orders (
        id         SERIAL PRIMARY KEY,
        order_no   VARCHAR(50)  NOT NULL,
        note       VARCHAR(255) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO orders(order_no, note) VALUES ('SEED-0001', 'initdb 種子資料');
