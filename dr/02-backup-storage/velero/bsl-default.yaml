# =============================================================================
# 02-backup-storage / velero/bsl-default.yaml
# BackupStorageLocation（BSL）：告訴 Velero「備份要寫到哪個 Object Storage」。
# 這份與線上 `kubectl -n velero get bsl default -o yaml` 的 spec 一致。
# `velero install` 會自動建立它；手動 apply 適用於新增第二個 BSL 或重建。
# =============================================================================
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default                     # Backup 沒指定 storageLocation 時用 default
  namespace: velero                 # 一律建立在 Velero 所在的 namespace
spec:
  provider: aws                     # 使用 velero-plugin-for-aws（任何 S3 相容儲存都用它）
  default: true                     # 標記為預設 BSL；同時只能有一個 default
  objectStorage:
    bucket: velero                  # bucket 名稱；必須事先存在
    # prefix: cluster-a             # 多座叢集共用同一個 bucket 時，用 prefix 分資料夾
  # credential:                     # 不寫 = 使用 Velero Pod 掛載的 cloud-credentials（velero install 預設）
  #   name: other-s3-credentials     # 第二個 BSL 用不同帳號時，才需要另外指定 Secret
  #   key: cloud
  config:
    region: us-east-1               # SeaweedFS 不驗 region，但 SDK 需要一個值
    s3ForcePathStyle: "true"        # path-style URL：http://10.90.1.125:8333/velero/...
    s3Url: http://10.90.1.125:8333  # SeaweedFS S3 endpoint（目前線上是 HTTP 直連）
  # accessMode: ReadOnly            # 單元 8：新叢集第一次接上時可先設唯讀，避免誤刪/誤寫舊備份
