# =============================================================================
# dr-demo / 03-cephfs-pvc.yaml
# 共享檔案磁碟：CephFS（檔案系統，RWX）。
# 跟 01 的 RBD（區塊，RWO）形成對照 —— 兩種 Ceph 儲存都要能備份、都要能還原，
# 課程會分別驗證「資料庫的資料」與「檔案系統的檔案」都真的回來了。
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-data
  namespace: dr-demo
spec:
  accessModes:
    - ReadWriteMany                     # RWX：多個節點上的多個 Pod 可同時讀寫
  storageClassName: rook-cephfs         # CephFS；Velero 透過 csi-cephfsplugin-snapclass 拍快照
  resources:
    requests:
      storage: 5Gi
