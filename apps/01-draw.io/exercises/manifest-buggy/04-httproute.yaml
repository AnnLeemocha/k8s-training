# Step 5：對外曝露服務
# 教學重點：這座叢集用的是 Gateway API（Cilium Gateway Controller），
# 不是傳統的 Ingress/Ingress-nginx，這是目前 K8s 社群的新標準，值得跟學員說明兩者差異。
#
# 這裡掛的是教學專用的 dev-gateway（見 ../../shared-infra/00-dev-gateway.yaml），
# 上課前要先套用過那份共用資源，dev-gateway 才會存在。
# http/https 兩個監聽器都掛，https 會用叢集既有的 *.nexai.org.com 自簽憑證
# （瀏覽器會出現不受信任警告，屬預期行為，可藉機講 TLS 憑證鏈）。
#
# !!! hostname 請依實際可用網域調整，並確認 DNS/hosts 有指向 dev-gateway 的 EXTERNAL-IP !!!
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: drawio
  namespace: drawio
spec:
  # 這個 HTTPRoute 要掛到哪個/哪些 Gateway 的哪個 listener 上；
  # 兩筆都掛代表 http 跟 https 的流量都會被導進來。
  parentRefs:
    - name: dev-gateway
      namespace: default
      sectionName: http
    - name: dev-gateway
      namespace: default
      sectionName: https
  # 只有帶這個 Host header 進來的請求才會被這條 Route 接手
  # （同一個 Gateway 可以同時掛很多產品，靠 hostname 分流）。
  hostnames:
    - "drawio.nexai.org.com"
  rules:
    - matches:
        - path:
            # PathPrefix + "/"：符合所有路徑，全部導向這個產品
            # （對照 Exact，可用來做更精細的路徑分流）。
            type: PathPrefix
            value: /
      backendRefs:
        # 實際轉送到哪個 Service、哪個 port（對應 03-service.yaml）。
        - name: drawio
          port: 8080
