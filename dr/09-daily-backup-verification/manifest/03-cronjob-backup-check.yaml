# =============================================================================
# 09-daily-backup-verification / manifest/03-cronjob-backup-check.yaml
# 每日備份檢查 + 通知。排在 daily-full-backup（01:00 UTC）之後兩小時。
# 成功也通知（NOTIFY_SUCCESS=true）：「今天沒收到訊息」本身就是異常訊號 ——
# 連檢查程式自己都沒跑，就代表整套機制壞了（dead man's switch 的概念）。
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-check
  namespace: dr-ops
spec:
  schedule: "0 3 * * *"                 # 每天 03:00 UTC（台灣 11:00）
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5             # 失敗紀錄多留幾份，方便追查
  jobTemplate:
    spec:
      backoffLimit: 0                   # 檢查失敗就是失敗，不要重試掩蓋問題
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: backup-verifier
          restartPolicy: Never
          containers:
            - name: check
              image: alpine/k8s:1.35.6  # 內含 kubectl/jq/curl/bash；版本對齊叢集 v1.35
              command: ["bash", "/scripts/backup-check.sh"]
              env:
                - name: SCHEDULE_NAME
                  value: daily-full-backup
                - name: MAX_AGE_HOURS
                  value: "26"           # 每日排程 + 2 小時緩衝
                - name: CLUSTER_NAME
                  value: k8s-training
                - name: NOTIFY_SUCCESS
                  value: "true"
                - name: WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: backup-notify
                      key: WEBHOOK_URL
                      optional: true    # 沒有 Secret 也能跑，只是不送通知
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: backup-verify-scripts
                defaultMode: 0755
