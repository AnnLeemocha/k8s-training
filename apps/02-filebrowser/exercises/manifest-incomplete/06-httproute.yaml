# Step 7：對外曝露服務
# 教學重點：跟 draw.io 用同一顆 dev-gateway（Gateway API / Cilium），
# 細節說明見 ../../draw.io/manifest/04-httproute.yaml；差別只在
# hostnames 換成本產品自己的網域，靠 Host header 在同一個 Gateway
# 上分流到不同 namespace 的 Service。
#
# 前置條件：先套用 ../../shared-infra/00-dev-gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filebrowser
  namespace: filebrowser
spec:
  # 這個 HTTPRoute 要掛到哪個/哪些 Gateway 的哪個 listener 上；
  # 兩筆都掛代表 http 跟 https 的流量都會被導進來。
  parentRefs:
    - name: __FILL_ME_20__
      namespace: default
      sectionName: http
    - name: dev-gateway
      namespace: default
      sectionName: https
  # 只有帶這個 Host header 進來的請求才會被這條 Route 接手
  # （同一個 Gateway 可以同時掛很多產品，靠 hostname 分流）。
  hostnames:
    - __FILL_ME_21__
  rules:
    - matches:
        - path:
            # PathPrefix + "/"：符合所有路徑，全部導向這個產品。
            type: PathPrefix
            value: /
      backendRefs:
        # 實際轉送到哪個 Service、哪個 port（對應 05-service.yaml）。
        - name: filebrowser
          port: __FILL_ME_22__
