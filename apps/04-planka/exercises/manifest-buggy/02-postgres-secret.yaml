# Step 3：PostgreSQL 的密碼
# 教學重點同 mysql：Secret 只是 base64，不是加密，僅供教學使用。
# 密碼故意不含特殊符號：Planka 應用程式是用單一組合好的
# DATABASE_URL（postgresql://user:pass@host/db）連線，密碼裡如果有
# 「@」「:」「/」這類 URI 保留字元，就得自己做 URL-encode，
# 教學範例故意避開這個複雜度。
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: planka
# Opaque：一般用途的鍵值對 Secret（對照 kubernetes.io/tls、
# kubernetes.io/dockerconfigjson 等有特定格式限制的內建型別）。
type: Opaque
# stringData 是明文寫法，K8s 會在建立時自動幫你 base64 編碼存進 data 欄位；
# 之後用 `kubectl get secret -o yaml` 看到的會是 base64（不是加密，只是編碼）。
stringData:
  # 官方 postgres image 的 entrypoint 認得的環境變數，會拿來初始化
  # 這三個值：建立這個角色、密碼，並建立/切換到這個資料庫。
  POSTGRES_USER: "planka"
  POSTGRES_PASSWORD: "TrainingPlanka123"
  POSTGRES_DB: "planka"
