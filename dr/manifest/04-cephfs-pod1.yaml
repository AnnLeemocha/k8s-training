# =============================================================================
# dr-demo / 04-cephfs-pod1.yaml
# 寫入端：把一個「驗證用的標記檔」寫進 CephFS。
# 還原後只要讀得到 DR-TEST-FS-001，就證明檔案資料真的救回來了。
#
# 教學提醒：這裡刻意用「裸 Pod」而不是 Deployment。裸 Pod 被刪就不會自己長回來，
# 而且 Velero 還原時會跳過已經 Succeeded/Failed 的 Pod —— 適合拿來討論
# 「備份時 Pod 的狀態」會影響還原結果。
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: cephfs-test-1
  namespace: dr-demo
spec:
  containers:
    - name: test
      image: busybox:1.36               # 極小的測試用 image
      command:
        - sh
        - -c
        - |
          echo "DR-TEST-FS-001" > /shared/dr-test.txt
          echo "CephFS Disaster Recovery Test" >> /shared/dr-test.txt
          sleep 36000
      # 注意：這裡每次啟動都會「覆寫」檔案；還原後這個 Pod 重新啟動也會重寫同樣內容，
      # 所以驗證 CephFS 時請看檔案時間戳記，或改用只讀 Pod（見 04-first-restore）。
      volumeMounts:
        - name: shared
          mountPath: /shared            # CephFS 掛載點
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: shared-data          # 對應 03-cephfs-pvc.yaml
