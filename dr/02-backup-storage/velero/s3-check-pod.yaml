# =============================================================================
# 02-backup-storage / velero/s3-check-pod.yaml
# 從「叢集外的角度」確認備份真的寫進 SeaweedFS：
# 用 Velero 自己那份 credentials，直接對 S3 做 ls（不經過 Velero）。
#
# 用法：
#   kubectl apply -f s3-check-pod.yaml
#   kubectl -n velero logs -f s3-check
#   kubectl -n velero delete pod s3-check
# 只做 ls（唯讀），不會改動任何備份。
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: s3-check
  namespace: velero                         # 要讀 velero namespace 的 cloud-credentials Secret
spec:
  restartPolicy: Never                      # 跑完就結束
  containers:
    - name: aws
      image: amazon/aws-cli:2.17.62         # 官方 AWS CLI，拿來當通用 S3 客戶端
      env:
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /cred/cloud                # 直接使用 Velero 的 credentials 檔格式
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: S3
          value: http://10.90.1.125:8333    # 與 BSL 的 s3Url 相同
      command:
        - sh
        - -c
        - |
          echo "== bucket 最上層"; aws --endpoint-url=$S3 s3 ls s3://velero/
          echo "== 備份清單";      aws --endpoint-url=$S3 s3 ls s3://velero/backups/
          echo "== kopia（PV 資料）依 namespace"; aws --endpoint-url=$S3 s3 ls s3://velero/kopia/
      volumeMounts:
        - name: cred
          mountPath: /cred
          readOnly: true
  volumes:
    - name: cred
      secret:
        secretName: cloud-credentials       # velero install 建立的 Secret（key: cloud）
