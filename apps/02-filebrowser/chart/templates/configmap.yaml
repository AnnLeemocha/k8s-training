apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "filebrowser.name" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "filebrowser.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      port: {{ .Values.containerPort }}
      baseURL: "/"
      disableUpdateCheck: true
      internalUrl: {{ printf "http://%s.%s.svc.cluster.local" (include "filebrowser.name" .) .Release.Namespace | quote }}
      database: "/home/filebrowser/data/filebrowser.db"
      cacheDir: "/home/filebrowser/data/cache"
      sources:
        - path: "/srv"
          name: "files"
          config:
            defaultEnabled: true
    auth:
      adminUsername: {{ .Values.config.adminUsername | quote }}
      adminPassword: {{ .Values.config.adminPassword | quote }}
      methods:
        password:
          enabled: true
          minLength: 5
    userDefaults:
      account:
        permissions:
          modify: true
          download: true
    integrations:
      office:
        url: {{ .Values.onlyoffice.url | quote }}
        internalUrl: {{ .Values.onlyoffice.internalUrl | quote }}
        secret: {{ .Values.onlyoffice.secret | quote }}
