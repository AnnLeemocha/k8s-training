# =============================================================================
# 02-backup-storage / velero/bsl-https.yaml
# 改走 HTTPS（seaweedfs/README.md「改用 HTTPS」建好的 Nginx reverse proxy）。
#
# 目前線上 BSL 還是 http://10.90.1.125:8333 直連 —— 若照 seaweedfs/README.md
# 的 Firewall 段落把 8333 擋掉，Velero 會立刻變成 Unavailable。
# 正確順序：先把 BSL 切到 HTTPS 並確認 Available，再開防火牆擋 8333。
#
# 自簽 CA（NexAI Internal Root CA）要放進 caCert，否則 Velero 會報 x509 unknown authority。
#   caCert 值 = base64 -w0 rootCA.crt
# =============================================================================
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
spec:
  provider: aws
  default: true
  objectStorage:
    bucket: velero
    caCert: <base64 -w0 rootCA.crt 的輸出>   # 信任自簽 Root CA；公有 CA 簽的憑證可省略
  # credential:                     # 不寫 = 使用 Velero Pod 掛載的 cloud-credentials（velero install 預設）
  #   name: other-s3-credentials     # 第二個 BSL 用不同帳號時，才需要另外指定 Secret
  #   key: cloud
  config:
    region: us-east-1
    s3ForcePathStyle: "true"
    s3Url: https://s3-seaweedfs.nexai.org.com   # 必須與 SeaweedFS -s3.externalUrl 一致，否則簽章驗證失敗
