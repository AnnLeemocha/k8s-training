# Step 9：部署 PeerTube 本體
# 教學重點：
#   - PEERTUBE_TRUST_PROXY 明確列出叢集 Pod 網段會落入的
#     'uniquelocal'（RFC1918 私有位址）：預設值只信任 'loopback'
#     （127.0.0.1），但流量是從 dev-gateway 的 Pod 網路進來，不是
#     從容器自己的 loopback，不調整的話 PeerTube 記錄到的用戶端 IP、
#     以及判斷請求是否為 https 都會不準確。
#   - PEERTUBE_WEBSERVER_HTTPS/PORT 填的是「使用者實際看到的網址」
#     （https, 443），跟 Service/容器內部實際監聽的 9000 port 是兩回事
#     ——Gateway 在邊界做 TLS 終止，Pod 內部收到的永遠是明文 HTTP，
#     但 PeerTube 產生的影片網址/ActivityPub 聯邦資訊要用外部看到的
#     網址，這兩者搞混是這類「後面有反向代理」架構常見的錯誤來源。
#   - nodeSelector/toleration 排到 gpu01，同 postgres/redis。
#   - securityContext 沒有 drop capabilities（實測踩到的坑，跟
#     mysql/redis 同一種教訓）：這個 image 的 entrypoint 一樣是以
#     root 啟動、再切換到內部的 peertube 使用者，drop 掉 capabilities
#     會讓它連使用者切換都做不到（`failed switching to "peertube":
#     operation not permitted`），容器直接啟動失敗。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peertube
  namespace: peertube
  labels:
    app: peertube
spec:
  # 只跑 1 個 replica：PeerTube 本體沒有為多實例橫向擴展設計
  # （檔案儲存/工作佇列協調都假設單一實例），跟 postgres 一樣。
  replicas: 1
  # Recreate：先砍舊 Pod 再建新的。因為只有 1 個 replica，若用
  # RollingUpdate 想維持不中斷還要多開一個 Pod，但這裡的儲存是
  # ReadWriteOnce PVC，同時間本來就只能被一個 Pod 掛載，新舊 Pod
  # 無法並存，只能接受更新時短暫中斷。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: peertube
  template:
    metadata:
      labels:
        app: peertube
    spec:
      # 跟 postgres/redis 排到同一台 gpu01，理由同前。
      nodeSelector:
        kubernetes.io/hostname: gpu01
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      # 關掉 K8s 預設會把同 namespace 每個 Service 的資訊自動注入成
      # <SVCNAME>_SERVICE_HOST/PORT 等環境變數的行為，避免這些自動
      # 注入的變數跟下面手動設定的 PEERTUBE_DB_PORT/PEERTUBE_REDIS_PORT
      # 等環境變數撞名、造成難以排查的設定錯誤。
      enableServiceLinks: false
      containers:
        - name: peertube
          image: chocobozzz/peertube:production-bookworm
          # IfNotPresent：節點上已有這個 image 就直接用，不重新拉取。
          imagePullPolicy: IfNotPresent
          env:
            # 以下四個 PEERTUBE_WEBSERVER_*/TRUST_PROXY 描述的是「使用者
            # 從外部瀏覽器看到的樣子」，跟下面 containerPort: 9000（容器
            # 實際監聽的 port）是完全不同的兩件事——這正是「後面有反向
            # 代理」架構下最容易搞混的地方。
            - name: PEERTUBE_WEBSERVER_HOSTNAME
              value: "peertube.nexai.org.com"
            # 外部使用者看到的 port（443，https 預設 port），不是容器
            # 內部監聽的 9000；PeerTube 產生影片網址/ActivityPub 聯邦
            # 資訊時會用這個值，填錯會讓對外連結全部指向錯誤的 port。
            - name: PEERTUBE_WEBSERVER_PORT
              value: "443"
            # 告訴 PeerTube「外部一律是 https 進來的」，即使容器內部
            # 收到的其實是 dev-gateway 終止 TLS 後轉來的明文 HTTP。
            - name: PEERTUBE_WEBSERVER_HTTPS
              value: "true"
            # 預設只信任 loopback（127.0.0.1）送來的 X-Forwarded-* 標頭；
            # 這裡流量是從 dev-gateway 的 Pod 網路（RFC1918 私有網段）
            # 進來，要多加 uniquelocal，PeerTube 才會正確採信反向代理
            # 附上的來源 IP／協定資訊，否則記錄到的用戶端 IP 跟
            # https 判斷都會不準確。
            - name: PEERTUBE_TRUST_PROXY
              value: '["loopback","linklocal","uniquelocal"]'
            - name: PEERTUBE_SECRET
              valueFrom:
                secretKeyRef:
                  name: peertube-secret
                  key: PEERTUBE_SECRET
            # 以下 DB_* 對應 05-postgres-statefulset.yaml / 04 的
            # Service 名稱、以及 02-postgres-secret.yaml 的帳密設定。
            - name: PEERTUBE_DB_HOSTNAME
              value: "postgres"
            - name: PEERTUBE_DB_PORT
              value: "5432"
            - name: PEERTUBE_DB_NAME
              value: "peertube"
            - name: PEERTUBE_DB_USERNAME
              value: "peertube"
            - name: PEERTUBE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: peertube-secret
                  key: PEERTUBE_DB_PASSWORD
            # 對應 06-redis.yaml 的 Service 名稱／port，PeerTube 拿
            # redis 當背景工作佇列與快取用。
            - name: PEERTUBE_REDIS_HOSTNAME
              value: "redis"
            - name: PEERTUBE_REDIS_PORT
              value: "6379"
            - name: PEERTUBE_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: peertube-secret
                  key: PEERTUBE_ADMIN_EMAIL
            # 關掉一般使用者自行註冊，教學環境只給預先建立好的 root
            # 帳號使用，避免學員互相誤用到別人的帳號。
            - name: PEERTUBE_SIGNUP_ENABLED
              value: "false"
            - name: PT_INITIAL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: peertube-secret
                  key: PT_INITIAL_ROOT_PASSWORD
          ports:
            # 容器實際監聽的 port，跟上面 PEERTUBE_WEBSERVER_PORT（443）
            # 是兩回事——Service/probe 這裡用的都是這個內部 9000。
            - name: http
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # readinessProbe：initialDelaySeconds/failureThreshold 都抓得
          #比一般無狀態應用寬（45 秒起跳、可以連續失敗 8 次），因為
          # PeerTube 第一次啟動要跑資料庫 migration，時間比較長。
          readinessProbe:
            httpGet:
              path: /api/v1/config
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          # livenessProbe：initialDelaySeconds 拉到 90 秒，避免第一次
          # 啟動 migration 還沒跑完就被判定「沒活著」而重啟，
          # 跟 flarum 的 mysql StatefulSet 是同一種教訓。
          livenessProbe:
            httpGet:
              path: /api/v1/config
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            # 注意：這裡沒有 drop capabilities（見上方教學重點的實測
            # 說明）——這個 image 的 entrypoint 一樣是以 root 啟動、
            # 再切換到內部的 peertube 使用者，drop 掉 capabilities 會讓
            # 使用者切換失敗、容器啟動不了。
          volumeMounts:
            # 掛進官方 image 的預設儲存路徑，對應 08-peertube-pvc.yaml。
            - name: storage
              mountPath: /app/storage
      securityContext:
        # Pod 層級：掛載進來的 Volume 會被強制改成這個 group 擁有，
        # 讓非 root 使用者也能讀寫這顆 PVC。
        fsGroup: 999
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: peertube-storage
