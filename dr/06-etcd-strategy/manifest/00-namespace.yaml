# =============================================================================
# 06-etcd-strategy / 00-namespace.yaml
# etcd 備份 CronJob 專用 namespace（與線上 etcd-backup namespace 一致）。
# 刻意不放在 kube-system：權限、Secret（S3 帳密）與清理範圍都獨立。
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: etcd-backup
  labels:
    app.kubernetes.io/part-of: k8s-training   # 純標記，方便篩選
    training/product: etcd-backup
