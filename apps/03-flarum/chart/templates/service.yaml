apiVersion: v1
kind: Service
metadata:
  name: {{ include "flarum.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flarum.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: flarum
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
