# =============================================================================
# 06-etcd-strategy / 03-cronjob.yaml
# 每台 control-plane 一支 CronJob：在該節點上對本機 etcd 拍 snapshot → 驗證 → 上傳 S3。
# 內容與線上 etcd-backup-k8s01/02/03 一致（線上目前 suspend: true，本檔亦維持 true，
# 由講師上課時決定是否 `kubectl patch ... suspend=false` 啟用）。
#
# 為什麼每台都拍？
#   - 任何一台的 snapshot 都是完整的叢集狀態（etcd 成員資料相同），只要一份就能還原；
#   - 但只靠一台，那台剛好壞掉/被 drain 時就沒有備份 → 三台都拍，互為備援。
# 為什麼用 nodeName 而不是 nodeSelector？
#   - nodeName 直接指定節點、繞過 scheduler，control-plane 資源緊繃時也一定跑得起來。
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup-k8s01
  namespace: etcd-backup
spec:
  schedule: "30 0 * * *"                  # 每天 00:30（kube-controller-manager 時區，本叢集為 UTC → 台灣 08:30）
  suspend: true                           # 與線上一致：目前暫停。啟用：kubectl -n etcd-backup patch cronjob etcd-backup-k8s01 -p '{"spec":{"suspend":false}}'
  concurrencyPolicy: Forbid               # 上一次還沒跑完就不要再開新的
  successfulJobsHistoryLimit: 3           # 保留最近 3 次成功的 Job 供查看 log
  failedJobsHistoryLimit: 3               # 保留最近 3 次失敗的 Job 供除錯
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600          # 10 分鐘沒做完就判定失敗（避免卡住）
      backoffLimit: 1                     # 失敗最多重試 1 次
      template:
        metadata:
          labels:
            app: etcd-backup
            node: k8s01
        spec:
          nodeName: k8s01                 # 固定跑在 k8s01（對它本機的 etcd 拍）
          hostNetwork: true               # 用節點網路 → 才能連 https://127.0.0.1:2379
          restartPolicy: Never
          tolerations:
            - key: node-role.kubernetes.io/control-plane   # control-plane 節點預設有這個 taint
              effect: NoSchedule
          initContainers:
            # --- 步驟 1：拍 snapshot ---
            - name: etcd-snapshot
              image: registry.k8s.io/etcd:3.6.6-0          # 與叢集 etcd 同版本，避免格式差異
              command:
                - etcdctl
                - snapshot
                - save
                - /backup/snapshot.db                      # 寫到 emptyDir
                - --endpoints=https://127.0.0.1:2379       # 本機 etcd（etcd 只 listen 127.0.0.1 與節點 IP）
                - --cacert=/etc/kubernetes/pki/etcd/ca.crt       # 驗證 etcd server 憑證
                - --cert=/etc/kubernetes/pki/etcd/server.crt     # 以 client 身分連線用的憑證
                - --key=/etc/kubernetes/pki/etcd/server.key
              env:
                - name: ETCDCTL_API
                  value: "3"                               # 使用 v3 API（3.4 以後預設即為 3，寫明比較清楚）
              volumeMounts:
                - name: etcd-certs
                  mountPath: /etc/kubernetes/pki/etcd
                  readOnly: true
                - name: backup
                  mountPath: /backup
            # --- 步驟 2：驗證 snapshot 檔案可讀（壞檔在這裡就失敗，不會上傳）---
            - name: etcd-snapshot-status
              image: registry.k8s.io/etcd:3.6.6-0
              command:
                - etcdutl                                  # 3.5+ 離線檔案操作改用 etcdutl
                - snapshot
                - status
                - /backup/snapshot.db
                - --write-out=table                        # 印出 hash / revision / keys / size
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            # --- 步驟 3：上傳到叢集外 S3 + 清理超過保留天數的舊檔 ---
            - name: upload
              image: docker.io/amazon/aws-cli:2.17.62
              command: ["/bin/sh", "/scripts/upload-and-prune.sh"]
              env:
                - name: NODE_NAME
                  value: k8s01                             # 用來區分 S3 上的資料夾：etcd-backups/k8s01/
                - name: S3_ENDPOINT
                  value: http://10.90.1.125:8333           # SeaweedFS（叢集外）
                - name: S3_BUCKET
                  value: etcd-backups                      # 與 Velero 的 bucket 分開
                - name: RETENTION_DAYS
                  value: "30"                              # 保留 30 天
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-s3-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: etcd-backup-s3-credentials
                      key: AWS_SECRET_ACCESS_KEY
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/pki/etcd             # kubeadm 產生的 etcd 憑證
                type: Directory
            - name: backup
              emptyDir: {}                                 # snapshot 暫存；Pod 結束即刪除，不留在節點上
            - name: scripts
              configMap:
                name: etcd-backup-scripts
                defaultMode: 0755                          # 讓腳本可執行（線上為 493 = 0755）
---
