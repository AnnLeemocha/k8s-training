apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flarum.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flarum.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flarum
  template:
    metadata:
      labels:
        {{- include "flarum.labels" . | nindent 8 }}
    spec:
      # 見 values.yaml 註解／README：Kubernetes 幫每個 Service 自動注入的
      # <SVCNAME>_PORT 環境變數會跟 Flarum 自己的 FLARUM_PORT 撞名，必須關閉。
      enableServiceLinks: false
      initContainers:
        # 等 mysql 可連線才啟動 flarum，否則全新環境第一次自動安裝會失敗、
        # 卡在網頁安裝表單（詳見 README「實測踩到的坑」）。
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 {{ .Values.db.host }} {{ .Values.db.port }}; do
                echo "waiting for {{ .Values.db.host }}:{{ .Values.db.port }} ..."
                sleep 3
              done
              echo "mysql is up"
        - name: init-storage-dirs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /storage/formatter /storage/sessions /storage/logs /storage/tmp \
                       /storage/cache /storage/less /storage/views /storage/locale
              mkdir -p /assets/avatars
              chown -R 991:991 /storage /assets
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: assets
              mountPath: /assets
      containers:
        - name: flarum
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_HOST
              value: {{ .Values.db.host | quote }}
            - name: DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: DB_NAME
              value: {{ .Values.db.name | quote }}
            - name: DB_USER
              value: {{ .Values.db.user | quote }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql.name" . }}-secret
                  key: MYSQL_PASSWORD
            - name: DB_PREF
              value: ""
            - name: FORUM_URL
              value: {{ .Values.forum.url | quote }}
            - name: FLARUM_TITLE
              value: {{ .Values.forum.title | quote }}
            - name: FLARUM_ADMIN_USER
              value: {{ .Values.forum.adminUser | quote }}
            - name: FLARUM_ADMIN_MAIL
              value: {{ .Values.forum.adminMail | quote }}
            - name: FLARUM_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "flarum.name" . }}-secret
                  key: FLARUM_ADMIN_PASS
            - name: LOG_TO_STDOUT
              value: "true"
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: storage
              mountPath: /flarum/app/storage
            - name: assets
              mountPath: /flarum/app/public/assets
      securityContext:
        fsGroup: 991
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "flarum.name" . }}-storage
        - name: assets
          persistentVolumeClaim:
            claimName: {{ include "flarum.name" . }}-assets
