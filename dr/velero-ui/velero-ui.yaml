# =============================================================================
# velero-ui / velero-ui.yaml
# 讓 OTWLD Velero UI 透過 Gateway API 對外（本叢集沒有 Ingress Controller）。
# 與線上 velero-ui/velero-ui HTTPRoute 一致（2026-09-23）。
#
# 注意：線上掛在正式的 admin-gateway（10.90.1.90），而不是課程用的 dev-gateway ——
# Velero UI 能建立 / 刪除備份與還原（背後 ServiceAccount 是 cluster-admin），
# 屬於管理工具，放在管理用 Gateway 並限制來源比較合理。
# 如果要讓學員在課堂上操作，可改掛 dev-gateway（見下方註解），並改 hostname。
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: velero-ui
  namespace: velero-ui                  # 與 helm install 的 namespace 相同
spec:
  hostnames:
    - velero.nexai.org.com             # 記得修改成你的 DNS 名稱（*.nexai.org.com 自簽萬用憑證）
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: admin-gateway               # 線上現況；課堂練習可改成 dev-gateway
      namespace: default                # Gateway 在 default namespace
      sectionName: https                # 只掛在 https listener
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /                    # 整個網站都導到 velero-ui
      backendRefs:
        - group: ""
          kind: Service
          name: velero-ui               # Helm chart 建立的 Service
          port: 3000                    # velero-ui 的 HTTP port
          weight: 1
