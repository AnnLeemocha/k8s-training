# onlyoffice — 完整合併版 manifest（單檔一次套用）
#
# 教學拆解版在 manifest/ 目錄（00~07 依序 apply，適合逐步講解）；
# 這份是給「已經教完拆解版、要快速重建環境」或「demo 用」的合併版，
# 內容與 manifest/ 目錄逐檔內容完全一致。
#
# 前置條件：先套用共用的 ../shared-infra/00-dev-gateway.yaml
# 注意：本產品資源需求重（官方建議 2 CPU / 4GB），已用
# nodeSelector 指定排到記憶體較寬裕的 gpu01 節點，上課前請確認
# 該節點狀況（kubectl top node gpu01）。
#
# 用法：
#   kubectl apply -f onlyoffice-all-in-one.yaml
# 清除：
#   kubectl delete namespace onlyoffice

# Step 1：建立本產品專屬的 Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: onlyoffice
  labels:
    # 純標記用途，方便日後用 `kubectl get ns -l xxx` 篩選同一堂課/同一產品的資源，
    # 對 K8s 本身沒有任何特殊行為意義。
    app.kubernetes.io/part-of: k8s-training
    training/product: onlyoffice
---
# Step 2：資源配額與預設值
# 教學重點：這是目前課程資源需求最重的一個產品（官方建議最少
# 2 CPU / 4GB RAM），quota 也要跟著放大，順便讓學員感受一下
# 「不同工作負載，該給多少資源配額」不是一套數字通吃全部產品。
apiVersion: v1
kind: ResourceQuota
metadata:
  name: onlyoffice-quota
  namespace: onlyoffice
spec:
  hard:
    # requests.* 是「整個 namespace 承諾要保留給它的資源總和上限」——
    # 排程器會用這個數字保證有節點容量，不是實際用量。這裡刻意抓到
    # 剛好夠 1 個 Pod 用（見下面 defaultRequest/最終 Deployment 的值）。
    requests.cpu: "2"
    requests.memory: 3Gi
    # limits.* 是整個 namespace 所有容器最多能吃到的資源總和上限，
    # 留了一些餘裕給偶爾的流量尖峰（轉檔/多人協作時 CPU 會飆高）。
    limits.cpu: "4"
    limits.memory: 6Gi
    # 這個產品實際只跑 1 個 replica（見 04-deployment.yaml），這裡給到 3
    # 是留一點餘裕給偵錯用的臨時 Pod（例如 kubectl debug/exec 起的
    # 輔助容器），避免教學時因為 quota 卡住。
    pods: "3"
    # 這個 namespace 最多能同時存在幾個 PVC（含未來示範多顆 PVC 用）；
    # 目前只用到 1 顆（03-pvc.yaml），數字留一點空間方便加練習用。
    persistentvolumeclaims: "4"
    # 所有 PVC 的 storage request 總和上限，要 >= 03-pvc.yaml 實際申請的
    # 5Gi，這裡抓 20Gi 是留給日後放大 Data volume 的彈性。
    requests.storage: 20Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: onlyoffice-limitrange
  namespace: onlyoffice
spec:
  limits:
    - type: Container
      # default：容器沒寫 limits 時的預設封頂值。這裡刻意抓得比
      # draw.io 高很多，因為 ONLYOFFICE 官方建議至少 2 CPU / 4GB，
      # 給太低的預設值反而會誤導學員以為這產品很輕量。
      default:
        cpu: "2"
        memory: 4Gi
      # defaultRequest：容器沒寫 requests 時的預設值，直接對齊
      # Deployment 實際寫的 requests（見 04-deployment.yaml），
      # 就算之後有人漏寫也不會被排到資源不夠的節點。
      defaultRequest:
        cpu: "1"
        memory: 2Gi
      # max：單一容器允許申請的資源上限，等於整個 namespace quota
      # 的 limits 上限，因為這裡本來就只打算跑 1 個 Pod。
      max:
        cpu: "4"
        memory: 6Gi
      # min：單一容器允許申請的資源下限，比 draw.io 高不少，
      # 避免有人手殘把這個吃資源的應用開得太小、啟動後直接卡死。
      min:
        cpu: 250m
        memory: 512Mi
---
# Step 3：JWT 簽章密鑰
# 教學重點：ONLYOFFICE Document Server 對外的所有請求（例如
# filebrowser/其他系統呼叫它做文件轉換/協作編輯）都要帶 JWT token
# 簽章，避免任何知道網址的人都能呼叫轉檔 API。JWT_SECRET 就是這把
# 簽章金鑰，串接其他系統時對方也要用同一把金鑰簽 token。
apiVersion: v1
kind: Secret
metadata:
  name: onlyoffice-secret
  namespace: onlyoffice
type: Opaque
stringData:
  # 教學用途明碼寫在這裡方便示範；正式環境應該用亂數產生、
  # 透過 Secret 管理工具（Sealed Secrets/Vault 等）注入，不要 commit 進版控。
  # 這把金鑰會在 04-deployment.yaml 透過 secretKeyRef 注入成
  # JWT_SECRET 環境變數，值必須跟這裡完全一致。
  JWT_SECRET: "TrainingOnlyofficeJwtSecret_ChangeMe"
---
# Step 4：持久化儲存（刻意簡化，請看下面說明）
# ONLYOFFICE Document Server 官方的「單容器全包」模式（我們這裡用的
# 預設模式）內部自帶 PostgreSQL、Redis、RabbitMQ，全部寫在容器內部
# 的 /var/lib/postgresql、/var/lib/rabbitmq 等路徑。這些路徑跟安裝的
# 套件版本強綁定，要在 Kubernetes 上長期正確地用 PVC 持久化，需要
# 更仔細地處理版本升級、權限等細節，這裡教學上刻意不展開，只示範
# 「有明確文件、單純的資料路徑」——/var/www/onlyoffice/Data，其餘
# 路徑（log、cache）用 emptyDir，重開機會重建但不影響核心功能。
# 白話說：這個範例重開 Pod 之後，內部資料庫/訊息佇列狀態會重置
# （回到剛安裝好的狀態），不會遺失「Document Server 裝好了」這件事，
# 但示範文件、協作紀錄不會保留。正式環境 ONLYOFFICE 官方建議接外部
# PostgreSQL / Redis / RabbitMQ，可以當作進階討論題目（也順便呼應
# 這座叢集目前資源吃緊、不適合再多開三個服務的現實考量）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onlyoffice-data
  namespace: onlyoffice
spec:
  accessModes:
    # ReadWriteOnce：同一時間只給單一節點掛載讀寫，跟 replicas: 1
    # 的設計相符（這個應用本來就不打算橫向擴展多個 Pod 同時寫）。
    - ReadWriteOnce
  # 這座叢集的區塊儲存 StorageClass（見 shared-infra），提供的是
  # 單一節點可掛載的持久卷，符合 ReadWriteOnce 的需求。
  storageClassName: rook-ceph-block
  resources:
    requests:
      # 只放 /var/www/onlyoffice/Data（使用者上傳/暫存文件），
      # 不含容器內建 Postgres/RabbitMQ 的資料目錄（見上面說明，
      # 那些用 emptyDir），所以 5Gi 教學用途夠用。
      storage: 5Gi
---
# Step 5：部署 ONLYOFFICE Document Server
# 教學重點：
#   - nodeSelector + tolerations：這座叢集記憶體最緊繃的三個節點
#     （k8s01~03）目前實際使用率已經 81~85%，這個 image 官方建議
#     至少 2 CPU / 4GB，硬排上去有把整個節點壓到記憶體不足、
#     波及其他共用工作負載（Rancher/Ceph/Velero 也在同一群集）的風險。
#     `gpu01` 目前記憶體用量最低（~24%），但它本身有
#     `nvidia.com/gpu=true:NoSchedule` 的 taint（保留給要用 GPU 的
#     工作負載），所以這裡明確用 nodeSelector 指定排到 gpu01，
#     並加上對應的 toleration 讓排程器願意把這個「不需要 GPU」的
#     Pod 排過去。這是「資源規劃要看實際叢集狀況，不能只套教科書
#     建議值」的活教材。
#   - securityContext 沒有做任何限制：這個 image 用 supervisor 同時管理
#     內建的 nginx / docservice / postgres / redis / rabbitmq 好幾個
#     系統服務，root 層級的 supervisor 需要對這些子服務做使用者切換
#     （su postgres / su rabbitmq...），跟 mysql 的教訓一樣，
#     不能隨便 drop capabilities。
#   - readiness/liveness 用官方內建的 /healthcheck 端點，但因為要等
#     內部好幾個服務都啟動完成，第一次啟動可能要 1~2 分鐘，
#     initialDelaySeconds/failureThreshold 給得比較寬鬆。
#   - PLUGINS_ENABLED=false（實測踩到的真坑）：預設會在背景啟動
#     documentserver-pluginsmanager，嘗試連到 github.com 下載外掛清單。
#     這座叢集/這個 namespace 的 NetworkPolicy 只放行 DNS + Gateway 進來
#     的流量，沒開一般對外網際網路的 egress，實測發現這個背景行程會
#     不斷重試連線失敗、卡在近乎吃滿 1 核 CPU 的迴圈裡（功能不受影響，
#     但白白浪費運算資源、也讓「CPU 用量」這個觀察指標失真）。
#     停用它，剛好也呼應「零信任網路下，這種預設會打外網的背景工作
#     要嘛開白名單、要嘛乾脆關掉」的討論。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  namespace: onlyoffice
  labels:
    app: onlyoffice
spec:
  # 只跑 1 個 Pod：內建 Postgres/Redis/RabbitMQ 全部裝在容器內部，
  # 沒有做多副本協調，開第二個 replica 只會得到兩份互不相通的內部
  # 資料庫，不是「高可用」而是資料不一致，所以刻意不橫向擴展。
  replicas: 1
  strategy:
    # Recreate：先砍掉舊 Pod 才建新的（對照 RollingUpdate 會新舊並存）。
    # 這裡只能用 Recreate：PVC 是 ReadWriteOnce（同時只能一個節點掛載），
    # 且兩個內建 Postgres/RabbitMQ 實例不能同時搶同一份資料跑，
    # 新舊 Pod 並存會直接互相衝突。
    type: Recreate
  selector:
    matchLabels:
      app: onlyoffice
  template:
    metadata:
      labels:
        app: onlyoffice
    spec:
      # 指定排到哪個節點：這裡的值要對應叢集實際節點名稱
      # （可用 `kubectl get nodes` 確認），詳細原因見檔頭說明。
      nodeSelector:
        kubernetes.io/hostname: gpu01
      # 容忍 gpu01 節點上「保留給 GPU 工作負載」的 taint，讓排程器
      # 願意把這個完全不需要 GPU 的 Pod 排過去（見檔頭說明）。
      # operator/value/effect 必須跟節點實際的 taint 完全對應，
      # 否則容忍不會生效、Pod 會一直卡在 Pending。
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: onlyoffice
          # 官方「單容器全包」image：內建 nginx + docservice +
          # postgres + redis + rabbitmq，不需另外接外部資料庫。
          # 用 :latest 純粹是教學方便；正式環境應釘死明確版本號，
          # 避免哪天官方推新版把行為改掉、教材對不上畫面。
          image: onlyoffice/documentserver:latest
          imagePullPolicy: IfNotPresent
          env:
            # 啟用 JWT 簽章驗證（跟 02-secret.yaml 的說明對應），
            # 沒開的話任何知道網址的人都能呼叫轉檔/協作 API。
            - name: JWT_ENABLED
              value: "true"
            # 從 Secret 讀取簽章金鑰，不直接明文寫在這裡；
            # 值必須跟呼叫端（例如 filebrowser）用的金鑰一致。
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: onlyoffice-secret
                  key: JWT_SECRET
            # 關閉外掛管理背景服務，避免它在零信任網路（無對外
            # egress）下卡在重試下載外掛清單、白吃 CPU 迴圈
            # （詳見檔頭「實測踩到的真坑」說明）。
            - name: PLUGINS_ENABLED
              value: "false"
          ports:
            # 容器內建 nginx 監聽的是 80，不是常見的 8080/443，
            # 這裡直接沿用 image 預設值，供下面 probe/Service 引用。
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            # requests 抓官方建議值（2 CPU/4GB）的一半，對應
            # 01-resourcequota-limitrange.yaml 的 defaultRequest，
            # 決定這個 Pod 會被排到剩餘容量足夠的節點。
            requests:
              cpu: "1"
              memory: 2Gi
            # limits 對齊官方建議的最低需求（2 CPU/4GB RAM），
            # 這是這顆 Pod 的封頂值，也是整個 namespace quota 的上限。
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            # 內部好幾個服務（nginx/docservice/postgres/rabbitmq...）
            # 都要陸續啟動完成，實測第一次就緒可能要 1~2 分鐘，
            # 給比 draw.io 寬鬆很多的初始等待時間。
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            # 容忍多次探測失敗才移出 Service Endpoints，避免啟動
            # 過程中的短暫忙碌被誤判成不健康。
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            # 比 readinessProbe 的延遲更長，確保容器真的完全啟動
            # 完成後才開始判斷「是否要重啟」，避免啟動中就被砍掉
            # 重練、陷入重啟迴圈。
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            # 唯一掛 PVC（持久化）的路徑：使用者上傳/暫存的文件資料。
            - name: data
              mountPath: /var/www/onlyoffice/Data
            # log 用 emptyDir：Pod 重建後歷史 log 會清空，教學上
            # 可接受（見檔頭關於持久化範圍的說明）。
            - name: log
              mountPath: /var/log/onlyoffice
            # lib 用 emptyDir：內建 Postgres/RabbitMQ 等的資料目錄
            # 就在這裡，代表它們的狀態不會持久保存，重開 Pod 會
            # 回到剛安裝好的狀態（呼應檔頭「刻意簡化」的說明）。
            - name: lib
              mountPath: /var/lib/onlyoffice
      securityContext:
        # 掛載進來的 Volume（PVC + 兩個 emptyDir）會被強制改成這個
        # group 擁有；102 是這個 image 內部執行 Document Server 服務
        # 的使用者/群組 GID，不對齊的話容器內程序會無法寫入這些路徑。
        fsGroup: 102
      volumes:
        - name: data
          # 對應 03-pvc.yaml 建立的 PVC，唯一持久化的資料。
          persistentVolumeClaim:
            claimName: onlyoffice-data
        - name: log
          # emptyDir：跟著 Pod 生命週期走，Pod 被刪除/重建就會清空。
          emptyDir: {}
        - name: lib
          emptyDir: {}
---
# Step 6：建立 ClusterIP Service，作為 Pod 的穩定進入點
# 教學重點：Pod 會因為重啟/滾動更新而換 IP，Service 透過 label selector
# 提供一個穩定的虛擬 IP + DNS 名稱（onlyoffice.onlyoffice.svc.cluster.local），
# filebrowser 呼叫 ONLYOFFICE 轉檔/協作 API 就是打這個位址。
apiVersion: v1
kind: Service
metadata:
  name: onlyoffice
  namespace: onlyoffice
  labels:
    app: onlyoffice
spec:
  # ClusterIP：只給叢集內部使用的虛擬 IP（預設類型）。對外曝露交給
  # 下一步的 HTTPRoute，不需要也不應該在這裡開 NodePort/LoadBalancer。
  type: ClusterIP
  # 只有帶這個 label 的 Pod，才會被收進這個 Service 的 Endpoints。
  selector:
    app: onlyoffice
  ports:
    - name: http
      # Service 自己對外（叢集內）曝露的 port。
      port: 80
      # 實際轉送到 Pod 的哪個 port；這裡用名稱 http，對應
      # Deployment 裡 containerPort: 80 的宣告，不用寫死數字。
      targetPort: http
---
# Step 7：對外曝露服務
# 教學重點：這座叢集用的是 Gateway API（Cilium Gateway Controller），
# 不是傳統的 Ingress/Ingress-nginx。http/https 兩個監聽器都掛，
# https 會用叢集既有的 *.nexai.org.com 自簽憑證（瀏覽器會出現不受信任
# 警告，屬預期行為）。
#
# 前置條件：先套用 ../../shared-infra/00-dev-gateway.yaml
# !!! hostname 請依實際可用網域調整，並確認 DNS/hosts 有指向 dev-gateway 的 EXTERNAL-IP !!!
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: onlyoffice
  namespace: onlyoffice
spec:
  # 這個 HTTPRoute 要掛到哪個/哪些 Gateway 的哪個 listener 上；
  # 兩筆都掛代表 http 跟 https 的流量都會被導進來。
  parentRefs:
    - name: dev-gateway
      namespace: default
      sectionName: http
    - name: dev-gateway
      namespace: default
      sectionName: https
  # 只有帶這個 Host header 進來的請求才會被這條 Route 接手
  # （同一個 Gateway 可以同時掛很多產品，靠 hostname 分流）。
  hostnames:
    - "onlyoffice.nexai.org.com"
  rules:
    - matches:
        - path:
            # PathPrefix + "/"：符合所有路徑，全部導向這個產品。
            type: PathPrefix
            value: /
      backendRefs:
        # 實際轉送到哪個 Service、哪個 port（對應 05-service.yaml）。
        - name: onlyoffice
          port: 80
---
# Step 7（進階、選用）：NetworkPolicy — 上課前請務必先實測
# 多一條 egress 規則：Document Server 要主動連回 filebrowser namespace
# 抓檔案內容、回報存檔結果（OnlyOffice 整合是雙向的，不是只有
# filebrowser 連 onlyoffice 單方向）。寫法同樣是用
# `kubernetes.io/metadata.name` 比對 namespace，見
# ../../filebrowser/manifest/07-networkpolicy.yaml 的對應規則。
# **實測踩到的坑**：一開始只開了 filebrowser → onlyoffice 這個方向，
# 結果編輯器打開後顯示「目前無法存取該檔案」——因為 Document Server
# 收到瀏覽器請求後，是它自己主動回頭呼叫 filebrowser 抓檔案，這個方向
# 沒開放就會整個卡住。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: onlyoffice
spec:
  # 空的 podSelector：選中「這個 namespace 裡的所有 Pod」。
  podSelector: {}
  # 同時管制進站跟出站，但這個 policy 完全沒寫 ingress/egress 規則，
  # 等於「全部擋下」——後面幾份 policy 再各自「補洞」開放必要流量。
  # 也正因為預設全擋，才會踩到下面 PLUGINS_ENABLED 連不出外網的坑
  # （見 04-deployment.yaml 檔頭說明）。
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: onlyoffice
spec:
  # 只對帶 app: onlyoffice 這個 label 的 Pod 生效。
  podSelector:
    matchLabels:
      app: onlyoffice
  policyTypes:
    - Ingress
  ingress:
    # from: [] 代表「不限來源」（含叢集外經 Gateway 進來的流量），
    # 但下面仍限制只開放 80 這個 port（容器內建 nginx 的監聽埠）。
    - from: []
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: onlyoffice
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # namespaceSelector: {} 代表「允許連到任何 namespace」，但這裡只
    # 開放 53 port（DNS），目的是讓 default-deny-all 生效後 Pod 仍然
    # 能解析 Service 的 DNS 名稱，不會連內部服務發現都失效。
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-onlyoffice-to-filebrowser
  namespace: onlyoffice
spec:
  podSelector:
    matchLabels:
      app: onlyoffice
  policyTypes:
    - Egress
  egress:
    # 只放行到 filebrowser 這個 namespace 的流量，用
    # kubernetes.io/metadata.name 這個內建 label（值等於 namespace
    # 名稱）精準比對，而不是空的 namespaceSelector（會放行到任何地方）。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: filebrowser
      ports:
        # filebrowser Service 對外曝露的 port（見
        # ../../filebrowser/manifest/05-service.yaml 一類的定義），
        # Document Server 主動回連抓檔案內容走的就是這個 port。
        - protocol: TCP
          port: 80
